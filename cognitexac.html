<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CognitExAc se movió de dirección</title>
<meta http-equiv="refresh" content="0; url=https://excelsioracademyoficial.github.io/Excelsior-Academy/cognitexac/">
<link rel="canonical" href="https://excelsioracademyoficial.github.io/Excelsior-Academy/cognitexac/">
<style>
  :root{color-scheme:dark light}
  html,body{height:100%}
  body{
    margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;
    background:#0d1929;color:#f4eddb;font-family:'Manrope',Arial,sans-serif;text-align:center;padding:24px;
  }
  .caja{max-width:420px}
  .spinner{width:40px;height:40px;margin:0 auto 18px;border-radius:50%;
    border:4px solid rgba(201,168,76,.25);border-top-color:#C9A84C;animation:girar 1s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}
  h1{font-size:1.15rem;margin:0 0 8px;color:#C9A84C}
  p{font-size:.95rem;line-height:1.5;opacity:.85;margin:0 0 18px}
  a{color:#C9A84C;font-weight:700;text-decoration:underline}
</style>
</head>
<body>
  <div class="caja">
    <div class="spinner"></div>
    <h1>CognitExAc cambió de dirección</h1>
    <p>Te estamos llevando al nuevo lugar automáticamente.<br>Si no pasa nada en unos segundos, toca aquí:</p>
    <a href="https://excelsioracademyoficial.github.io/Excelsior-Academy/cognitexac/">
      Entrar a CognitExAc
    </a>
  </div>
  <script>
    location.replace('https://excelsioracademyoficial.github.io/Excelsior-Academy/cognitexac/');
  </script>
</body>
</html>
